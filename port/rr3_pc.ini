[display]
# window_mode: windowed | borderless | fullscreen
window_mode=windowed
# 0 = auto-detect best size fitting your monitor without overflowing
width=0
height=0
vsync=true
fps_cap=0
unlock_menu_fps=true

[graphics]
# quality_preset: low | medium | high | ultra
quality_preset=ultra
render_scale=1.0
anisotropy=16
msaa_samples=0

[logging]
# verbose_logs: true opens a live console window with detailed engine/JNI/GLES logs
verbose_logs=false

[input]
android_tv_mode=false
steer_ramp_rate=4.5
steer_return_rate=7.0
key_throttle=W
key_brake=S
key_left=A
key_right=D
key_handbrake=Space
key_camera=C
key_rear_view=V
key_confirm=Return
key_back=Escape
key_pause=Escape
